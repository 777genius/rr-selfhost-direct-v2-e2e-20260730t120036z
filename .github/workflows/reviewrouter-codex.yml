name: ReviewRouter Codex
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
permissions: {}
jobs:
  codex-review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.draft == false }}
    concurrency:
      group: reviewrouter-codex-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: 777genius/review-router/.github/workflows/reviewrouter-t0-reusable.yml@1f716776ea5fa4f8b27d106a6145c016c7554e9c
    with:
      runtime_ref: "1f716776ea5fa4f8b27d106a6145c016c7554e9c"
      api_url: "https://cluster-protocols-generic-behalf.trycloudflare.com"
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      review_head_sha: ${{ github.event.pull_request.head.sha }}
      provider_instance_id: "codex-rotating:1317220367"
      runtime_config_mode: oidc
      codex_session_mode: account-gateway
      workflow_schema_version: 2
      review_timeout_minutes: 20
