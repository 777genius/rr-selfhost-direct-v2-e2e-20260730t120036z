name: ReviewRouter Codex
run-name: ${{ format('ReviewRouter review {0}', inputs.review_request_id) }}
on:
  workflow_dispatch:
    inputs:
      review_request_id:
        description: Durable ReviewRouter request identity
        required: true
        type: string
      pr_number:
        description: Pull request number selected by ReviewRouter
        required: true
        type: string
      review_head_sha:
        description: Expected pull request head selected by ReviewRouter
        required: true
        type: string
permissions: {}
jobs:
  codex-review:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.review_request_id != '' && inputs.pr_number != '' && inputs.review_head_sha != '' }}
    concurrency:
      group: reviewrouter-codex-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: 777genius/review-router/.github/workflows/reviewrouter-t0-reusable.yml@60f7bb342185b5496af7a0756ee9763873c75750
    with:
      runtime_ref: "60f7bb342185b5496af7a0756ee9763873c75750"
      api_url: "https://api.reviewrouter.site"
      pr_number: ${{ inputs.pr_number }}
      review_head_sha: ${{ inputs.review_head_sha }}
      provider_instance_id: "codex-rotating:1317220367"
      runtime_config_mode: oidc
      codex_session_mode: account-gateway
      workflow_schema_version: 2
      review_timeout_minutes: 60
