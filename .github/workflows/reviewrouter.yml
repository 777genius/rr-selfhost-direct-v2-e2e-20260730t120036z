name: ReviewRouter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  repository_dispatch:
    types: [reviewrouter_conflict_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number for manual reruns"
        required: false
        type: string

permissions: {}

concurrency:
  group: reviewrouter-conflict-${{ github.repository }}-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false


jobs:
  review:
    name: review
    if: ${{ github.event_name != 'repository_dispatch' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: 777genius/review-router/.github/workflows/reviewrouter-reusable.yml@280993e55ff36d85350dac4a3674ce46d11cc3e3
    with:
      runtime_ref: 280993e55ff36d85350dac4a3674ce46d11cc3e3
      api_url: "https://api.reviewrouter.site"
      runtime_config_mode: oidc
      static_runtime_env_json: |-
        {
          "REVIEWROUTER_CONFIG_SCHEMA_VERSION": "2",
          "REVIEW_AUTH_MODE": "mimo-token-plan-api",
          "REVIEW_PROVIDERS": "codex-mimo/mimo-v2.6-pro",
          "REQUIRED_HEALTHY_PROVIDERS": "codex-mimo/mimo-v2.6-pro",
          "SYNTHESIS_MODEL": "codex-mimo/mimo-v2.6-pro",
          "PROVIDER_LIMIT": "1",
          "PROVIDER_MAX_PARALLEL": "1",
          "INLINE_MIN_AGREEMENT": "1",
          "INLINE_MAX_COMMENTS": "50",
          "INLINE_MIN_SEVERITY": "minor",
          "TARGET_TOKENS_PER_BATCH": "50000",
          "FAIL_ON_SEVERITY": "major",
          "CODEX_REASONING_EFFORT": "xhigh",
          "CODEX_AGENTIC_CONTEXT": "true",
          "CODEX_FAST_MODE": "false",
          "REVIEW_ROUTER_REVIEW_INVESTIGATION_RECORDING_ENABLED": "1",
          "REVIEW_ROUTER_REVIEW_INVESTIGATION_SHADOW_ENABLED": "1",
          "REVIEW_ROUTER_REVIEW_INVESTIGATION_CONTEXT_CRITIC_ENABLED": "1",
          "REVIEW_ROUTER_REVIEW_INVESTIGATION_VERIFIED_CLEAN_ENABLED": "1",
          "REVIEW_ROUTER_REVIEW_INVESTIGATION_CROSS_REVISION_REPLAY_ENABLED": "0",
          "REVIEW_ROUTER_REVIEW_INVESTIGATION_PRODUCTION_EFFECTS_ENABLED": "1",
          "BUDGET_MAX_USD": "1"
        }
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
    secrets:
      REVIEW_ROUTER_LEDGER_KEY: ${{ secrets.REVIEW_ROUTER_LEDGER_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      CODEX_CONFIG_TOML: ${{ secrets.CODEX_CONFIG_TOML }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MIMO_TOKEN_PLAN_API_KEY: ${{ secrets.MIMO_TOKEN_PLAN_API_KEY }}

  conflict-review:
    name: conflict review
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'reviewrouter_conflict_review' }}
    permissions:
      contents: read
      id-token: write
    uses: 777genius/review-router/.github/workflows/reviewrouter-conflict-reusable.yml@280993e55ff36d85350dac4a3674ce46d11cc3e3
    with:
      runtime_ref: 280993e55ff36d85350dac4a3674ce46d11cc3e3
      api_url: "https://api.reviewrouter.site"
      runtime_config_mode: oidc
      pr_number: ${{ github.event.client_payload.pr_number }}
      review_kind: conflict-head
      conflict_repository_id: ${{ github.event.client_payload.repository_id || '' }}
      conflict_dispatch_event_type: ${{ github.event.client_payload.dispatch_event_type || '' }}
      conflict_dispatch_id: ${{ github.event.client_payload.dispatch_id || '' }}
      conflict_dispatch_nonce: ${{ github.event.client_payload.nonce || '' }}
      conflict_head_sha: ${{ github.event.client_payload.head_sha || '' }}
      conflict_base_ref: ${{ github.event.client_payload.base_ref || '' }}
      conflict_base_sha: ${{ github.event.client_payload.base_sha || '' }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      CODEX_CONFIG_TOML: ${{ secrets.CODEX_CONFIG_TOML }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MIMO_TOKEN_PLAN_API_KEY: ${{ secrets.MIMO_TOKEN_PLAN_API_KEY }}
